version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: startconnector_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: startconnector123
      MYSQL_DATABASE: startconnector
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pstartconnector123"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: startconnector_api
    restart: unless-stopped
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: startconnector
      DB_USER: root
      DB_PASSWORD: startconnector123
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python seed.py && uvicorn main:app --host 0.0.0.0 --port 8080"

volumes:
  mysql_data:
